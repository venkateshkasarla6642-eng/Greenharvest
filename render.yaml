services:
  - type: web
    name: greenharvest
    runtime: docker
    dockerfilePath: ./Dockerfile
    branch: main
    region: singapore
    plan: free
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: greenharvest-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: greenharvest-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: greenharvest-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: greenharvest-db
          property: user
      - key: DB_PASS
        fromDatabase:
          name: greenharvest-db
          property: password

databases:
  - name: greenharvest-db
    plan: free
    databaseName: greenharvest
    user: greenharvest
