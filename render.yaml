services:
  - type: web
    name: greenharvest
    runtime: docker
    dockerfilePath: ./Dockerfile
    branch: main
    region: singapore
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: greenharvest-db
          property: externalConnectionString

databases:
  - name: greenharvest-db
    plan: free
    databaseName: greenharvest
    user: greenharvest
